name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: SS${{ matrix.silverstripe }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per supported Silverstripe major, at the oldest and newest PHP that major is
          # used with here. The module's composer.json is the source of truth for the supported
          # range; this matrix must follow it.
          - silverstripe: '5'
            php: '8.1'
            recipe: '^5'
            testing: '^3'
          - silverstripe: '5'
            php: '8.3'
            recipe: '^5'
            testing: '^3'
          - silverstripe: '6'
            php: '8.3'
            recipe: '^6'
            testing: '^4'
          - silverstripe: '6'
            php: '8.4'
            recipe: '^6'
            testing: '^4'

    services:
      database:
        # MariaDB rather than MySQL: it matches both the local dev machines and the Forge
        # servers, so a version-specific failure here means something real.
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ss_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      SS_DATABASE_CLASS: MySQLDatabase
      SS_DATABASE_SERVER: 127.0.0.1
      SS_DATABASE_PORT: 3306
      SS_DATABASE_USERNAME: root
      SS_DATABASE_PASSWORD: root
      SS_DATABASE_NAME: ss_ci
      SS_ENVIRONMENT_TYPE: dev

    steps:
      - name: Check out the module
        uses: actions/checkout@v4
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, mysqli, gd, zip, dom, xml, tokenizer, simplexml, ctype, hash, session
          tools: composer:v2
          coverage: none

      - name: Build a host project
        # The module cannot be tested on its own: it needs a booted Silverstripe app. The host
        # composer.json is written by hand; recipe-cms is required so the host is a realistic
        # site (and the recipe installs the app/ project files, including the Page class).
        #
        # The module is pulled in through a PATH repository pointing at the checkout, symlinked
        # rather than mirrored ON PURPOSE: /tests is export-ignore in .gitattributes, so a
        # mirrored (dist-style) install would contain no tests at all.
        run: |
          mkdir -p app-host
          cd app-host
          cat > composer.json <<JSON
          {
            "name": "restruct/ci-host",
            "require": {
              "silverstripe/recipe-cms": "${{ matrix.recipe }}",
              "silverstripe/recipe-testing": "${{ matrix.testing }}",
              "restruct/silverstripe-form-obfuscator": "*"
            },
            "repositories": [
              { "type": "path", "url": "../module", "options": { "symlink": true } }
            ],
            "autoload-dev": {
              "psr-4": {
                "Restruct\\\\FormObfuscator\\\\Tests\\\\": "vendor/restruct/silverstripe-form-obfuscator/tests/"
              }
            },
            "minimum-stability": "dev",
            "prefer-stable": true,
            "config": { "allow-plugins": true }
          }
          JSON
          # Every Silverstripe 5 release is covered by advisory PKSA-pjvm-vnw2-n3m2 (range
          # <6.2.1), which will not be patched on the 5 line, so Composer refuses to install it
          # under the default policy. Disabled HERE ONLY, in a throwaway CI host project.
          composer config policy.advisories.block false
          composer update --no-interaction --no-progress

      - name: Configure the test suite
        run: |
          cd app-host
          cat > phpunit.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!-- Warning-to-error escalation is the RUNNER's behaviour and differs by PHPUnit
               major: 9 (SS5) converts warnings by default, 11 (SS6) has no such attribute.
               failOnWarning is pinned so a warning behaves identically on every leg. -->
          <phpunit bootstrap="vendor/silverstripe/framework/tests/bootstrap.php" colors="true"
                   failOnWarning="true">
              <testsuites>
                  <testsuite name="formobfuscator">
                      <directory>vendor/restruct/silverstripe-form-obfuscator/tests</directory>
                  </testsuite>
                  <testsuite name="consumer">
                      <directory>app/tests</directory>
                  </testsuite>
              </testsuites>
          </phpunit>
          XML

      - name: Add a consumer-shape database test
        # A module's own suite structurally cannot catch an unbuildable fixture in its tests/ dir
        # (PHPUnit loads those files, the class manifest never registers them, no tables are
        # built). A DB test in the HOST project, run with a flush, builds the temp database with
        # this module's tests/ in the manifest - the way a consuming project would.
        run: |
          mkdir -p app-host/app/tests
          cat > app-host/app/tests/ConsumerDbTest.php <<'PHP'
          <?php

          use SilverStripe\Dev\SapphireTest;
          use SilverStripe\Security\Member;

          class ConsumerDbTest extends SapphireTest
          {
              protected $usesDatabase = true;

              public function testTempDatabaseBuilds()
              {
                  $m = Member::create(['FirstName' => 'x']);
                  $m->write();
                  $this->assertGreaterThan(0, $m->ID);
              }
          }
          PHP

      - name: Run tests
        working-directory: app-host
        # Every run flushes the manifest, and how differs per major:
        # - SS5 (framework 5, PHPUnit 9): SS_PHPUNIT_FLUSH does not exist in framework 5, so it
        #   would be inert. The flush is a trailing `flush=1` argument, which only works AFTER an
        #   explicit test path - `--testsuite x flush=1` makes PHPUnit 9 open "flush=1" as a file
        #   and fail. So the SS5 legs run by path; phpunit.xml still supplies bootstrap and
        #   failOnWarning.
        # - SS6 (framework 6, PHPUnit 11): a `flush=1` argument no longer works; framework 6 reads
        #   SS_PHPUNIT_FLUSH instead, which also combines with --testsuite.
        #
        # A green run is not enough on its own: a suite that silently loads fewer tests (a class
        # not found, a directory not matched) also exits 0. So the module suite's summary line is
        # checked for the exact test count, identical on both majors, and the SS6 legs add
        # --fail-on-empty-test-suite (PHPUnit 11 exits 0 on an empty suite otherwise). Bump
        # EXPECTED_TESTS whenever a test is added or removed.
        env:
          EXPECTED_TESTS: '21'
        run: |
          set -o pipefail
          if [ "${{ matrix.silverstripe }}" = "5" ]; then
            vendor/bin/phpunit vendor/restruct/silverstripe-form-obfuscator/tests flush=1 | tee module-tests.log
            vendor/bin/phpunit app/tests flush=1
          else
            SS_PHPUNIT_FLUSH=1 vendor/bin/phpunit --testsuite formobfuscator --fail-on-empty-test-suite | tee module-tests.log
            SS_PHPUNIT_FLUSH=1 vendor/bin/phpunit --testsuite consumer --fail-on-empty-test-suite
          fi
          grep -q "^OK (${EXPECTED_TESTS} tests" module-tests.log \
            || { echo "Expected OK (${EXPECTED_TESTS} tests, ...) in the module suite output"; exit 1; }

      - name: Boot the app and build the database
        # The suite proves the class behaves; this proves the module does not break a real boot
        # and that the middleware is live on a real request (the login form's action must come
        # out encoded). The sake CLI differs per major.
        working-directory: app-host
        run: |
          if [ "${{ matrix.silverstripe }}" = "5" ]; then
            vendor/bin/sake dev/build flush=1
            vendor/bin/sake Security/login > login.html
          else
            vendor/bin/sake db:build --flush
            vendor/bin/sake navigate Security/login > login.html
          fi
          grep -q 'id="MemberLoginForm_LoginForm" action="&#' login.html

  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the module's declared php constraint.
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check every PHP file
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
